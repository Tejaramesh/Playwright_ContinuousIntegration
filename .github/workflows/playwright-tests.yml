name: Playwright Tests (Sharded)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Keep other shards running if one shard fails
      matrix:
        # Define the shard indices (0, 1, 2 = 3 parallel runners)
        shard: [0, 1, 2]
        total-shards: [3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright pytest-html pytest-shard
          playwright install --with-deps

      - name: Run Playwright test shard
        run: |
          pytest \
            --shard-id=${{ matrix.shard }} \
            --num-shards=${{ matrix.total-shards }} \
            --html=reports/report-${{ matrix.shard }}.html \
            --self-contained-html

      - name: Upload Shard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-shard-${{ matrix.shard }}
          path: reports/
          retention-days: 14